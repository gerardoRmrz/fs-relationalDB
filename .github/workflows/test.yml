name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci
      #########################################
      - name: Create .env file
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/test_db?sslmode=disable" > .env
          echo "PORT=3001" >> .env
          echo "SECRET=test_secret" >> .env
          exho "TESTING=true" >> .env
          echo "NODE_ENV=test" >> .env
          cat .env  # Verificar contenido      echo

      #########################################
      - name: Debug environment
        run: |
          echo "PORT: $PORT"
          echo "TEST_DATABASE_URL: $TEST_DATABASE_URL"
          echo "DATABASE_URL: $DATABASE_URL"
          sudo netstat -tulpn | grep 3001 || echo "Port 3001 not listening"
        env:
          PORT: 3001
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_db?sslmode=disable
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_db?sslmode=disable
      ##############################################
      - name: Start application
        run: |
          npm start > app.log 2>&1 &
          sleep 5
          echo "=== Application logs ==="
          cat app.log
          echo "=== Node processes ==="
          ps aux | grep node || echo "No node processes found"
          echo "=== Ports in use ==="
          sudo netstat -tulpn | grep LISTEN || echo "No listening ports found"

        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_db?sslmode=disable
          PORT: 3001
          SECRET: test_secret
          NODE_ENV: test

      - name: Wait for application to be ready
        run: npx wait-on http://127.0.0.1:3001 -t 60000

      - name: Run tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_db?sslmode=disable
          PORT: 3001
          SECRET: test_secret

      - name: Print application logs on failure
        if: failure()
        run: cat app.log

      - name: Stop application
        if: always()
        run: pkill -f "node index.js" || true
