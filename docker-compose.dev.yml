# Use postgres/example user/password credentials

services:
  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    volumes:
      - ./db:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: mysecret

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
